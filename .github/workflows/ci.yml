name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the npm install-script allowlist policy
        run: npm install --global npm@12.0.2
      # The Node tests and security scan do not require native keytar bindings.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:cold-start
      - run: npm run security:scan
      - run: npm audit --omit=dev --audit-level=high
